name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate redirect HTML
        run: npx --yes html-validate@10.5.0 index.html

      - name: Validate pull request template
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const template = readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8');
          const requiredSections = ['## What & why', '## How it was tested', '## Checklist'];
          const missing = requiredSections.filter((section) => !template.includes(section));
          if (missing.length) throw new Error(`Missing required template sections: ${missing.join(', ')}`);
          if (!template.includes('No secrets, user data, or `.env` contents')) {
            throw new Error('Data-safety checklist item is missing.');
          }
          console.log('Pull request template contains the required sections and data-safety checklist.');
          NODE
